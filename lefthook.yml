pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,mts,cts,js,mjs,cjs}"
      run: pnpm oxlint --fix {staged_files}
      stage_fixed: true
    - name: format
      glob: "*.{ts,mts,cts,js,mjs,cjs,json,jsonc,yml,yaml,md}"
      run: pnpm oxfmt {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,mts,cts}"
      run: pnpm tsc
